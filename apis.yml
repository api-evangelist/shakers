name: Shakers
description: >-
  Shakers is a Spanish technology platform — "the house of freeworking" — that connects
  enterprises with vetted, top-tier freelance developers and digital professionals. Its
  AI-powered products include Shakers AI (a copilot for project scoping and talent matching),
  Talent Insight (profile and skills analysis), Shakers Verified (technical verification of
  freelance profiles), and AI Interviews (automated candidate assessment). The platform serves
  450+ enterprise clients including Telefónica, EY, BBVA, Microsoft, and HP across a community of
  10,000+ tech freelancers. Backed by Partech, Shakers was added to the API Evangelist network as
  a portfolio-company profile; as of this enrichment pass it publishes a consumer web platform but
  no public developer or API surface.
